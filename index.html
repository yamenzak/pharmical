<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAFB" />
    <meta name="description" content="Pharmical — the world-class wholesale pharmaceutical distributor based in the UAE. Same-day delivery, flexible payments, and dedicated account managers." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pharmical — The Supplier of Today" />
    <meta property="og:description" content="The world-class wholesale pharmaceutical distributor based in the UAE. Same-day delivery, flexible payments, dedicated account managers." />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Pharmical" />
    <meta property="og:url" content="https://www.pharmical.net" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pharmical — The Supplier of Today" />
    <meta name="twitter:description" content="The world-class wholesale pharmaceutical distributor based in the UAE." />
    <meta name="twitter:image" content="/brand/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Apply persisted theme before paint to avoid flash. Default = light.
      try {
        var stored = localStorage.getItem("pharmical-theme");
        if (stored === "dark") {
          document.documentElement.classList.add("dark");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#0A0A12");
        }
      } catch (e) {}
    </script>
    <title>Pharmical — The Supplier of Today</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
